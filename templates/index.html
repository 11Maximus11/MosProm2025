<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат поддержки - Росатом</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <img src="https://www.rosatom.ru/local/tpl/img/site_rosatom_ru.png" alt="Rosatom Logo" class="logo">
            <h1>Чат поддержки</h1>
        </header>
        <div class="chat-messages" id="chat-messages">
            <!-- Messages will be appended here by JavaScript -->
            <div class="message bot-message">
                <p>Здравствуйте! Я ваш виртуальный ассистент. Чем могу помочь?</p>
            </div>
        </div>
        <div class="chat-input-area">
            <div id="action-confirmation" class="action-confirmation" style="display: none;">
                <p id="action-text"></p>
                <button id="confirm-button">Подтвердить</button>
                <button id="cancel-button">Отклонить</button>
            </div>
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="Введите ваш вопрос...">
                <button id="send-button">Отправить</button>
            </div>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
